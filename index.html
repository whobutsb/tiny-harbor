<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tiny Harbor — a miniature island village</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0b1220;
    font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #app { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; touch-action:none; }

  #title { position:fixed; top:14px; left:16px; color:#eef3f7; opacity:.85; pointer-events:none;
    text-shadow:0 1px 6px rgba(0,0,0,.5); user-select:none; }
  #title h1 { margin:0; font-size:17px; font-weight:650; letter-spacing:.4px; }
  #title p  { margin:2px 0 0; font-size:11.5px; opacity:.75; }

  #ui { position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
    display:flex; gap:14px; align-items:center; flex-wrap:wrap; justify-content:center;
    padding:9px 14px; border-radius:14px; background:rgba(12,18,30,.55);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.12); color:#e8eef4; font-size:12px; user-select:none; }
  #ui .group { display:flex; gap:6px; align-items:center; }
  #ui label { opacity:.75; white-space:nowrap; }
  #ui input[type=range] { width:130px; accent-color:#f2b56b; }
  #ui button { background:rgba(255,255,255,.10); color:#e8eef4; border:1px solid rgba(255,255,255,.16);
    border-radius:8px; padding:4px 9px; font-size:12px; cursor:pointer; }
  #ui button:hover { background:rgba(255,255,255,.20); }
  #ui button.on { background:#f2b56b; color:#2a1c08; border-color:#f2b56b; font-weight:600; }
  body.record #ui, body.record #title { display:none; }

  #hint { position:fixed; right:14px; bottom:14px; color:#cfdae4; opacity:.55; font-size:11px;
    pointer-events:none; text-shadow:0 1px 4px rgba(0,0,0,.6); max-width:230px; text-align:right; }
  body.record #hint { display:none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>

<div id="title">
  <h1>Tiny Harbor</h1>
  <p>a living miniature · drag to orbit · click a building or boat</p>
</div>

<div id="ui">
  <div class="group">
    <label for="time">Day</label>
    <input id="time" type="range" min="0" max="1000" value="300" title="time of day">
    <span id="clock" style="width:44px">07:12</span>
  </div>
  <div class="group" id="speeds">
    <label>Speed</label>
    <button data-speed="0.5">0.5×</button>
    <button data-speed="1" class="on">1×</button>
    <button data-speed="2">2×</button>
    <button data-speed="4">4×</button>
  </div>
  <div class="group" id="weatherBtns">
    <label>Weather</label>
    <button data-weather="clear" class="on">Clear</button>
    <button data-weather="rain">Rain</button>
    <button data-weather="snow">Snow</button>
  </div>
  <div class="group">
    <button id="dofBtn" class="on" title="tilt-shift soft focus">Soft focus</button>
    <button id="soundBtn">Sound off</button>
  </div>
</div>

<div id="hint">drag · orbit &nbsp;|&nbsp; scroll / pinch · zoom<br>click boat, house, windmill or lighthouse to fly close · click sea to return</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
